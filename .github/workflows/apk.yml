name: Crea app Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compila
        run: gradle -p android assembleDebug --no-daemon
      - name: Pubblica APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk diario-scolastico.apk
          gh release create "app-${{ github.run_number }}" diario-scolastico.apk --title "Diario scolastico ${{ github.run_number }}" --notes "App Android" --latest
